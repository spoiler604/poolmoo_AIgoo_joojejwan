      <h1>소개글</h1>
      <p class="article-intro">에이구는 AI 인프라 구조를 공부한 조입니다.</p>
      <section>
        <span class="article-section-label">01 · 각자의 공부를 한곳에</span>
        <h2>하고 싶은 공부에 집중했습니다</h2>
        <p>저희는 하고 싶은 공부를 하자는 취지 아래 공동 작품보다 개인의 공부에 집중했습니다. 두 달 남짓되는 시간 동안 바이브 코딩, IT 인프라, 기업과 AI 등 다양한 주제로 공부를 했으며 매주 수요일, 일요일에 모여 중간 점검을 가졌습니다.</p>
        <p>주제관으로는 각자가 공부한 내용을 모아 브라우저를 만들었습니다.</p>
      </section>
      <section>
        <span class="article-section-label">02 · 보이지 않는 기반부터</span>
        <h2>AI 인프라를 이해하는 출발점</h2>
        <p>AI를 이해하기 위해서는 보이는 기술보다 먼저 보이지 않는 기반을 이해해야 합니다. AI 인프라에는 소프트웨어, 하드웨어를 포함해 많은 요소들이 있습니다.</p>
        <p>조원들이 열심히 공부한 주제를 보고 AI 인프라에 대해 조금이라도 알아가는 기회가 되었으면 좋겠습니다.</p>
      </section>
    </template>
    <template id="gyeomseo-article">
      <div class="article-kicker">겸서의 이야기</div>
      <h1>IT 인프라의 의미</h1>
      <p class="article-intro">IT 인프라는 IT 시스템을 떠받치는 기반이자 구조다.</p>
      <section>
        <span class="article-section-label">01 · 일상을 떠받치는 기반</span>
        <h2>IT 시스템과 인프라</h2>
        <p>IT 시스템은 정보기술(information technology)을 이용한 온라인 쇼핑이나 예약 시스템 등을 말한다. IT 인프라는 이 IT 시스템을 떠받치는 기반이자 구조다.</p>
        <p>인프라는 인프라스트럭처(infrastructure)의 줄임말로, 사회의 기반이 되는 시설이나 시스템 등을 가리킨다. 인터넷과 스마트폰이 널리 보급된 오늘날, IT 시스템은 이제 일상생활에 필수적인 존재가 되었으며, 이를 뒷받침하는 IT 인프라의 역할도 그만큼 중요해졌다.</p>
      </section>
      <section>
        <span class="article-section-label">02 · 컴퓨터의 중앙 처리 장치</span>
        <h2>CPU와 프로세서</h2>
        <p>CPU(central processing unit)는 중앙 처리 장치로, 컴퓨터 안에서 주요 연산, 주변기기 및 소프트웨어의 명령 처리, 메모리 제어 등을 담당하는 부품이다. 범용 프로세서(processor)라고도 불린다.</p>
        <p>여기서 프로세서는 입력받은 데이터를 해석하고, 연산과 처리 명령을 수행하는 핵심 하드웨어를 말한다. CPU는 각 장치를 제어하고, 각 장치는 주기억 장치(메모리)를 통해 CPU와 데이터를 주고받는다.</p>
      </section>
      <section>
        <span class="article-section-label">03 · 함께 처리하는 여러 코어</span>
        <h2>코어와 병렬 처리</h2>
        <p>CPU 내 독립된 처리 유닛을 코어(core)라고 하며, 코어가 여러 개 있을 경우 각각의 코어는 동시에 다른 명령을 실행할 수 있다. 이처럼 여러 코어를 이용해 작업을 병렬로 처리하면 전체적인 성능이 향상된다.</p>
        <p class="article-source">참고 · 츠루나가 신이치, 『그림으로 이해하는 인프라 구조와 기술』, 길벗, 2026, 115쪽.</p>
      </section>
    </template>

    <template id="woohui-refik">
      <div class="article-kicker">우희의 기록</div>
      <h1>레픽 아나돌 주제관</h1>
      <h2>레픽 아나돌</h2>
      <p class="article-intro">빅데이터를 이용한 미디어아트의 선구자로 튀르키예 출신 아티스트다.</p>
      <figure><img src="./assets/articles/woohui/refik/bin0001.png" alt="거대한 스크린에 데이터 기반 미디어아트가 전시된 모습" width="900" height="900" draggable="false"></figure>
      <blockquote>뉴욕 현대미술관MoMA의 1층 로비, 거대한 스크린 하나가 걸려 있습니다. 화면 속에서는 물감 같은 덩어리가 쉬지 않고 흘러내리고, 뭉치고, 흩어져요. MoMA가 100년 가까운 시간 동안 수집해 온 그림 13만 8천여 건을 AI가 한꺼번에 들여다본 뒤 눈을 감고 꾸는 꿈입니다.</blockquote>
      <p class="article-source">《기획회의》 580호 중에서</p>
      <p>바람의 패턴, 도시 소음, 우주 탐사 이미지, 뇌파 데이터 등 보이지 않는 데이터 바탕으로 '데이터 페인팅'을 만들었다. "기계가 학습할 수 있다면, 꿈도 꿀 수 있을까?”라는 질문을 바탕으로 AI가 꿈을 꾸는 과정을 시각화했다. 인간의 꿈은 꾸는 동안 기억과 데이터 바탕으로 무의 식의 상태가 형상을 이룬다. MoMA가 100년 가까운 시간 동안 수집해 온 13만 8천여 건의 방대한 데이터를 AI에게 통째로 학습시킨 후 처음에는 인간이 직접 그림 사이의 관계를 설명해 줬다. 인공지능이 스스로 연결성을 찾아가고 형태를 만드는 과정에서 아나돌은 인공지능이 꿈을 꾼다고 말한다.</p>
      <p>그 밖에도 데이터랜드 안에서는 데이터셋을 활용한 작품들이 전시되어 있다. 아나돌은 인공지능에게 시각, 후각, 수치 등 인간의 감각과 연결 짓는다. 지속적인 감각 자극은 피로감을 주지만 인간의 지능을 기술을 AI로 다룬 아나돌의 발상은 특이했다. 인간과 같은 체계를 가진 AI를 살아있는 존재로 받아들일 것인가? 단순히 기억과 경험을 바탕으로 생각하는 사람과, 거대한 데이터 기반의 확률적인 답변 하는 AI는 뭐가 다를까? AI를 인간의 뉴런 구조를 모방하여 설계한 것도 흥미롭다.</p>
      <blockquote>“AI를 살아있는 존재로 받아들일 것인가?”</blockquote>

      <h1>My AI</h1>
      <p class="article-intro">지금 하는 프로젝트가 정말 AI를 구현하게 될지 단순히 내 타자 연습을 시켜 준 것인지는 끝까지 가봐야 안다.</p>
      <p>나는 스스로 생각하고 성장하는 AGI모델을 제시했다. 우리는 그에 가까운 시스템을 만들기 위해 똑똑한 AI 하나를 만드는 것이 아닌, 여러 AI들을 사용할 수 있는 공통된 외부 시스템 구축을 목표로 설계했다.</p>
      <h2>챗gpt와 함께 설계한 ‘My AI’</h2>
      <pre class="editor-diagram" aria-label="나의 시스템이 여러 AI와 도구 및 기기에 연결되는 구조">나
